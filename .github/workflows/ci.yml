name: Application CI

# Why these triggers and not more:
#   - pull_request/main -> every change proposed against main must pass before merge
#   - push/main          -> catches anything that reaches main outside the PR path
#                           (e.g. an admin merge, a hotfix) and re-validates the
#                           resulting state of main itself, not just the diff
#   - workflow_dispatch  -> lets a maintainer re-run validation after an
#                           infrastructure-only change (pinned action bump, runner
#                           flake) without needing an empty commit to retrigger CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Default to read-only. Individual jobs opt into anything broader they
# genuinely need (see the `security` job) instead of the workflow granting
# it to every job by default.
permissions:
  contents: read

# A new push to the same PR makes the previous run's result meaningless -
# cancel it instead of burning runner minutes validating a diff nobody will
# look at. Runs on main are never in the same group as each other because
# push events land on distinct commit SHAs sharing the same ref, and the
# cancellation only ever targets an *older* run in the same group.
concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to match the interpreter PhoenixAuto-Ops actually ships on - see
  # the builder/runtime stages in Dockerfile (python:3.11-slim). Testing
  # against a different interpreter than the one running in production
  # would validate the wrong thing.
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # flake8/black are CI-only tooling, not runtime dependencies of the
      # monitoring engine - intentionally kept out of requirements.txt and
      # pinned here instead, so a change to lint tooling never touches what
      # actually gets installed in the Docker image.
      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.1.1 black==24.8.0

      # --extend-ignore=E203,W503 is the standard black/flake8 compatibility
      # pair (slice-colon spacing and line-break-before-binary-operator) -
      # not a general loosening of the ruleset, just removing two rules that
      # actively disagree with black's own formatting decisions.
      - name: Run flake8
        run: |
          flake8 app/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --show-source \
            --statistics

      - name: Check formatting with black
        run: black --check --diff --line-length=120 app/

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Coverage flags (--cov, --cov-report) are intentionally not repeated
      # here - pytest.ini already defines them project-wide, including
      # --cov-report=xml for the Codecov integration tracked under
      # Deferred Improvements. Passing them again on the CLI would just be
      # a second source of truth that can silently drift from pytest.ini.
      - name: Run test suite
        run: pytest -v

      # Coverage XML is produced by pytest.ini's addopts (--cov-report=xml)
      # for every run, not just this one - uploading it as a build artifact
      # makes it inspectable without wiring up an external service yet.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
          if-no-files-found: warn

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    # SARIF upload writes to the repository's Security tab - the only
    # reason this job needs anything beyond the workflow-level
    # `contents: read`. lint/test never touch this permission.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install security tooling
        run: pip install bandit==1.7.9 pip-audit==2.7.3

      # Medium+ severity, medium+ confidence only. Bandit's low/low bucket
      # is dominated by things like the subprocess usage in
      # app/healing/actions.py, which is deliberate (list-form args,
      # shell=False, hardcoded script paths - see docs/architecture.md
      # Security Model) and not an actual finding worth gating merges on.
      - name: Static security analysis (bandit)
        run: |
          bandit -r app \
            --severity-level medium \
            --confidence-level medium \
            -f sarif -o bandit-results.sarif

      - name: Upload bandit SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
        # SARIF upload requires GitHub Advanced Security on the repo. A
        # failed upload is an environment/plan limitation, not a security
        # regression in the code, so it doesn't fail the whole job.
        continue-on-error: true

      # Any known CVE against a pinned dependency in requirements.txt is
      # actionable (bump the pin or consciously accept the risk) - unlike
      # bandit's confidence/severity levels there's no meaningful
      # "informational-only" bucket to carve out here.
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt --desc

  # Single required status check for branch protection instead of naming
  # three separate jobs there. lint/test/security run in parallel with no
  # real dependency on each other, so this is the only place a `needs:`
  # chain belongs in this workflow.
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: always()
    steps:
      - name: Verify all required checks passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then
            echo "::error::One or more required checks failed (lint=${{ needs.lint.result }}, test=${{ needs.test.result }}, security=${{ needs.security.result }})"
            exit 1
          fi
          echo "All required checks passed."
          